name: Check listing

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly, to catch dead links and files replaced at a listed URL.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
