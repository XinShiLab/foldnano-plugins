name: Check listing

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly, with --live: confirms Pages still serves every listed zip, unchanged, with CORS.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
        if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
      - run: npm run check -- --live
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
