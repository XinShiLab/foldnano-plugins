name: Check listing

on:
  pull_request:
  push:
    branches: [main]
  # After each Pages build, and weekly, with --live: confirms Pages serves every listed zip,
  # unchanged, with CORS.
  page_build:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, so --base can diff against the PR base or the previous push.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check -- --base "origin/$BASE_REF"
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
      # A push that creates the branch has no previous commit to compare with.
      - run: npm run check -- --base "$BEFORE"
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        env:
          BEFORE: ${{ github.event.before }}
      - run: npm run check -- --live
        if: github.event_name == 'page_build' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
